name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: requirements-test.txt
      - name: Install Python and test dependencies
        run: |
          uv venv --managed-python --python 3.14.2
          uv pip install -r requirements-test.txt
      - run: .venv/bin/ruff check custom_components tests
      - run: .venv/bin/ruff format --check custom_components tests
      - run: .venv/bin/pytest --cov=custom_components.pushie --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: coverage
          path: coverage.xml
