[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-p no:respx --strict-config --strict-markers"
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
source = ["custom_components.pushie"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100
